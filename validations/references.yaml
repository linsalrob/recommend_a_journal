- id: Shah2023-es
  entry_type: article
  title: Expanding known viral diversity in the healthy infant gut
  authors: Shah, Shiraz A and Deng, Ling and Thorsen, Jonathan and Pedersen, Anders G and Dion, Moïra B and Castro-Mejía, Josué L and Silins, Ronalds and Romme, Fie O and Sausset, Romain and Jessen, Leon E and Ndela, Eric Olo and Hjelmsø, Mathis and Rasmussen, Morten A and Redgwell, Tamsin A and Leal Rodríguez, Cristina and Vestergaard, Gisle and Zhang, Yichang and Chawes, Bo and Bønnelykke, Klaus and Sørensen, Søren J and Bisgaard, Hans and Enault, Francois and Stokholm, Jakob and Moineau, Sylvain and Petit, Marie-Agnès and Nielsen, Dennis S
  journal: Nat Microbiol
  actual_journal: Nat Microbiol
  year: 2023
  doi: 10.1038/s41564-023-01345-7
  pmid: '37037943'
  pmc: PMC10159846
  abstract: The gut microbiome is shaped through infancy and impacts the maturation of the immune system, thus protecting against chronic disease later in life. Phages, or viruses that infect bacteria, modulate bacterial growth by lysis and lysogeny, with the latter being especially prominent in the infant gut. Viral metagenomes (viromes) are difficult to analyse because they span uncharted viral diversity, lacking marker genes and standardized detection methods. Here we systematically resolved the viral diversity in faecal viromes from 647 1-year-olds belonging to Copenhagen Prospective Studies on Asthma in Childhood 2010, an unselected Danish cohort of healthy mother-child pairs. By assembly and curation we uncovered 10,000 viral species from 248 virus family-level clades (VFCs). Most (232 VFCs) were previously unknown, belonging to the Caudoviricetes viral class. Hosts were determined for 79% of phage using clustered regularly interspaced short palindromic repeat spacers within bacterial
    metagenomes from the same children. Typical Bacteroides-infecting crAssphages were outnumbered by undescribed phage families infecting Clostridiales and Bifidobacterium. Phage lifestyles were conserved at the viral family level, with 33 virulent and 118 temperate phage families. Virulent phages were more abundant, while temperate ones were more prevalent and diverse. Together, the viral families found in this study expand existing phage taxonomy and provide a resource aiding future infant gut virome research.
  pdf: refs/S/Shah et al. 2023 - Expanding known viral diversity in the healthy infant gut.pdf

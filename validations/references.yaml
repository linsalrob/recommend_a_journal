- id: McNair2024-tj
  entry_type: article
  title: '{PRFect}: a tool to predict programmed ribosomal frameshifts in prokaryotic and viral genomes'
  authors: McNair, Katelyn and Salamon, Peter and Edwards, Robert A and Segall, Anca M
  journal: BMC Bioinformatics
  actual_journal: BMC Bioinformatics
  year: 2024
  doi: 10.1186/s12859-024-05701-0
  pmid: '38389044'
  pmc: PMC10885494
  abstract: 'BACKGROUND: One of the stranger phenomena that can occur during gene translation is where, as a ribosome reads along the mRNA, various cellular and molecular properties contribute to stalling the ribosome on a slippery sequence and shifting the ribosome into one of the other two alternate reading frames. The alternate frame has different codons, so different amino acids are added to the peptide chain. More importantly, the original stop codon is no longer in-frame, so the ribosome can bypass the stop codon and continue to translate the codons past it. This produces a longer version of the protein, a fusion of the original in-frame amino acids, followed by all the alternate frame amino acids. There is currently no automated software to predict the occurrence of these programmed ribosomal frameshifts (PRF), and they are currently only identified by manual curation. RESULTS: Here we present PRFect, an innovative machine-learning method for the detection and prediction of PRFs in
    coding genes of various types. PRFect combines advanced machine learning techniques with the integration of multiple complex cellular properties, such as secondary structure, codon usage, ribosomal binding site interference, direction, and slippery site motif. Calculating and incorporating these diverse properties posed significant challenges, but through extensive research and development, we have achieved a user-friendly approach. The code for PRFect is freely available, open-source, and can be easily installed via a single command in the terminal. Our comprehensive evaluations on diverse organisms, including bacteria, archaea, and phages, demonstrate PRFect''s strong performance, achieving high sensitivity, specificity, and an accuracy exceeding 90%. The code for PRFect is freely available and installs with a single terminal command. CONCLUSION: PRFect represents a significant advancement in the field of PRF detection and prediction, offering a powerful tool for researchers and scientists
    to unravel the intricacies of programmed ribosomal frameshifting in coding genes.'

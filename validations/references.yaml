  title: Extending and improving metagenomic taxonomic profiling with uncharacterized species using {MetaPhlAn} 4
  authors: Blanco-Míguez, Aitor and Beghini, Francesco and Cumbo, Fabio and McIver, Lauren J and Thompson, Kelsey N and Zolfo, Moreno and Manghi, Paolo and Dubois, Leonard and Huang, Kun D and Thomas, Andrew Maltez and Nickols, William A and Piccinno, Gianmarco and Piperni, Elisa and Punčochář, Michal and Valles-Colomer, Mireia and Tett, Adrian and Giordano, Francesca and Davies, Richard and Wolf, Jonathan and Berry, Sarah E and Spector, Tim D and Franzosa, Eric A and Pasolli, Edoardo and Asnicar, Francesco and Huttenhower, Curtis and Segata, Nicola
  journal: Nat. Biotechnol.
  actual_journal: Nat. Biotechnol.

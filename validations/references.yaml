- id: Ortiz-de-Ora2025-kf
  entry_type: article
  title: Phollow reveals in situ phage transmission dynamics in the zebrafish gut microbiome at single-virion resolution
  authors: Ortiz de Ora, Lizett and Wiles, Elizabeth T and Zünd, Mirjam and Bañuelos, Maria S and Haro-Ramirez, Nancy and Suder, Diana S and Ujagar, Naveena and Ayala-Angulo, Julio and Trinh, Calvin and Knitter, Courtney and Gonen, Shane and Nicholas, Dequina A and Wiles, Travis J
  journal: Nat. Microbiol.
  actual_journal: Nat. Microbiol.
  year: 2025
  doi: 10.1038/s41564-025-01981-1
  pmid: '40251446'
  pmc: ''
  abstract: Bacteriophages show promise for microbiome engineering, but studying their transmission dynamics in multimember communities and animal hosts is technically challenging. We therefore created 'Phollow', a live imaging-based approach for tracking phage replication and spread in situ with single-virion resolution. Following interbacterial phage transmission is achieved by marking virions with distinct fluorescent proteins during assembly in newly infected cells. In vitro cell virology studies revealed clouds of phage virions dispersing upon bacterial lysis, leading to rampant transmission. Combining Phollow with optically transparent zebrafish, we visualized phage outbreaks within the vertebrate gut. We observed that virions from a zebrafish-derived Plesiomonas strain, but not a human-derived E. coli, rapidly disseminate systemically to the liver and brain. Moreover, antibiotics triggered waves of interbacterial transmission and sudden shifts in gut community ecology. Phollow ultimately
    empowers multiscale investigations of phage transmission and transkingdom interactions that have the potential to open new avenues for phage-based microbiome therapies.

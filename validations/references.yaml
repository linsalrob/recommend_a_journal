- id: Dahlman2025-uv
  entry_type: article
  title: Isolation, engineering and ecology of temperate phages from the human gut
  authors: Dahlman, Sofia and Avellaneda-Franco, Laura and Rutten, Emily L and Gulliver, Emily L and Solari, Sean and Chonwerawong, Michelle and Kett, Ciaren and Subedi, Dinesh and Young, Remy B and Campbell, Nathan and Gould, Jodee A and Bell, Jasmine D and Docherty, Callum A H and Turkington, Christopher J R and Nezam-Abadi, Neda and Grasis, Juris A and Lyras, Dena and Edwards, Robert A and Forster, Samuel C and Barr, Jeremy J
  journal: Nature
  actual_journal: Nature
  year: 2025
  doi: 10.1038/s41586-025-09614-7
  pmid: ''
  pmc: ''
  abstract: Abstract Large-scale metagenomic and data-mining efforts have revealed an expansive diversity of bacteriophages (phages) within the human gut1–3. However, functional understanding of phage–host interactions within this complex environment is limited, largely due to a lack of cultured isolates available for experimental validation. Here we characterize 134 inducible prophages originating from 252 human gut bacterial isolates using 10 different induction conditions to expand the experimentally validated temperate phage–host pairs originating from the human gut. Importantly, only 18% of computationally predicted prophages could be induced in pure cultures. Moreover, we construct a 78-member synthetic microbiome that, when co-cultured in the presence of human colonic cells (Caco2), led to the induction of 35% phage species. Using cultured isolates, we demonstrate that human host-associated cellular products may act as induction agents, providing a possible link between gastrointestinal
    cell lysis and temperate phage populations4,5. We provide key insights into prophage diversity and genetics, including a genetic pathway for domestication, finding that polylysogeny was common and resulted in coordinated prophage induction, and that differential induction can be influenced by divergent prophage integration sites. More broadly, our study highlights the importance of culture-based techniques, alongside experimental validation, genomics and computational prediction, to understand the biology and function of temperate phages in the human gut microbiome. These culture-based approaches will enable applications across synthetic biology, biotechnology and microbiome fields.

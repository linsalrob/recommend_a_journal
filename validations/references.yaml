- id: Von_Meijenfeldt2023-ho
  entry_type: article
  title: A social niche breadth score reveals niche range strategies of generalists and specialists
  authors: von Meijenfeldt, F A Bastiaan and Hogeweg, Paulien and Dutilh, Bas E
  journal: Nat Ecol Evol
  actual_journal: Nat Ecol Evol
  year: 2023
  doi: 10.1038/s41559-023-02027-7
  pmid: '37012375'
  pmc: PMC10172124
  abstract: Generalists can survive in many environments, whereas specialists are restricted to a single environment. Although a classical concept in ecology, niche breadth has remained challenging to quantify for microorganisms because it depends on an objective definition of the environment. Here, by defining the environment of a microorganism as the community it resides in, we integrated information from over 22,000 environmental sequencing samples to derive a quantitative measure of the niche, which we call social niche breadth. At the level of genera, we explored niche range strategies throughout the prokaryotic tree of life. We found that social generalists include opportunists that stochastically dominate local communities, whereas social specialists are stable but low in abundance. Social generalists have a more diverse and open pan-genome than social specialists, but we found no global correlation between social niche breadth and genome size. Instead, we observed two distinct evolutionary
    strategies, whereby specialists have relatively small genomes in habitats with low local diversity, but relatively large genomes in habitats with high local diversity. Together, our analysis shines data-driven light on microbial niche range strategies.

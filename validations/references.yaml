- id: Rostol2024-kl
  entry_type: article
  title: Bacteriophages avoid autoimmunity from cognate immune systems as an intrinsic part of their life cycles
  authors: Rostøl, Jakob T and Quiles-Puchalt, Nuria and Iturbe-Sanz, Pablo and Lasa, Íñigo and Penadés, José R
  journal: Nat Microbiol
  actual_journal: Nat Microbiol

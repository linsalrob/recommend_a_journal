  abstract: Several studies have reported increased microbial diversity, or distinct microbial community compositions, in the microbiomes of Indigenous peoples around the world. However, there is a widespread failure to include Indigenous cultures and perspectives in microbiome research programmes, and ethical issues pertaining to microbiome research involving Indigenous participants have not received enough attention. We discuss the benefits and risks arising from microbiome research involving Indigenous peoples and analyse microbiome ownership as an ethical concept in this context. We argue that microbiome ownership represents an opportunity for Indigenous peoples to steward and protect their resident microbial communities at every stage of research.

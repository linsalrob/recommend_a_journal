  pmid: '37463935'
  pmc: PMC10354031
  abstract: Crassvirales (crAss-like phages) are an abundant group of human gut-specific bacteriophages discovered in silico. The use of crAss-like phages as human fecal indicators is proposed but the isolation of only seven cultured strains of crAss-like phages to date has greatly hindered their study. Here, we report the isolation and genetic characterization of 25 new crAss-like phages (termed crAssBcn) infecting Bacteroides intestinalis, belonging to the order Crassvirales, genus Kehishuvirus and, based on their genomic variability, classified into six species. CrAssBcn phage genomes are similar to ΦCrAss001 but show genomic and aminoacidic differences when compared to other crAss-like phages of the same family. CrAssBcn phages are detected in fecal metagenomes around the world at a higher frequency than ΦCrAss001. This study increases the known crAss-like phage isolates and their abundance and heterogeneity open the question of what member of the Crassvirales group should be selected
    as human fecal marker.
  pdf: refs/R/Ramos-Barbero et al. 2023 - Characterization of crAss-like phage isolates highlights Crassvirales genetic heterogeneity and worldwide distribution.pdf

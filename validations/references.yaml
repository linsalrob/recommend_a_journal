  authors: Manghi, Paolo and Antonello, Giacomo and Schiffer, Lucas and Golzato, Davide and Wokaty, Andres and Beghini, Francesco and Mirzayi, Chloe and Long, Kaelyn and Gravel-Pucillo, Kai and Piccinno, Gianmarco and Gamboa-Tuz, Samuel David and Bonetti, Arianna and D'Amato, Giacomo and Azhar, Rimsha and Eckenrode, Kelly and Zohra, Fatima and Giunchiglia, Valentina and Keller, Marisa and Pedrotti, Anna and Likhotkin, Ilya and Elsafoury, Shaimaa and Geistlinger, Ludwig and Blanco-Miguez, Aitor and Thomas, Andrew Maltez and Zolfo, Moreno and Ramos, Marcel and Valles-Colomer, Mireia and Tamburini, Sabrina and Asnicar, Francesco and Jones, Heidi E and Huttenhower, Curtis and Carey, Vincent and Davis, Sean and Pasolli, Edoardo and Oh, Sehyun and Segata, Nicola and Waldron, Levi

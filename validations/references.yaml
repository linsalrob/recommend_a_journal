  abstract: Amid rising antimicrobial resistance and limited antibiotic innovation, bacteriophages are gaining attention as potential therapeutics across human health, animal, and food sectors. Despite historical use, their clinical application in humans remains constrained by scientific, industrial, and regulatory challenges. To address these issues, the Transatlantic Task Force on Antimicrobial Resistance (TATFAR) convened sessions with experts from member parties. This perspective synthesizes insights from the TATFAR group, highlighting regulatory differences, research gaps, and opportunities for international collaborations to advance bacteriophage therapy.

- id: Bader2023-vo
  entry_type: article
  title: A relational framework for microbiome research with Indigenous communities
  authors: Bader, Alyssa C and Van Zuylen, Essie M and Handsley-Davis, Matilda and Alegado, Rosanna A and Benezra, Amber and Pollet, Rebecca M and Ehau-Taumaunu, Hanareia and Weyrich, Laura S and Anderson, Matthew Z
  journal: Nature Microbiology
  actual_journal: Nature Microbiology
  year: 2023
  doi: 10.1038/s41564-023-01471-2
  pmid: ''
  pmc: ''
  abstract: Ethical practices in human microbiome research have failed to keep pace with scientific advances in the field. Researchers seeking to ‘preserve’ microbial species associated with Indigenous groups, but absent from industrialized populations, have largely failed to include Indigenous people in knowledge co-production or benefit, perpetuating a legacy of intellectual and material extraction. We propose a framework centred on relationality among Indigenous peoples, researchers and microbes, to guide ethical microbiome research. Our framework centres accountability to flatten historical power imbalances that favour researcher perspectives and interests to provide space for Indigenous worldviews in pursuit of Indigenous research sovereignty. Ethical inclusion of Indigenous communities in microbiome research can provide health benefits for all populations and reinforce mutually beneficial partnerships between researchers and the public. A framework centred on relationality among Indigenous
    peoples, researchers and microorganisms is presented, to guide ethical microbiome research.
  pdf: refs/B/Bader et al. 2023 - A relational framework for microbiome research with Indigenous communities.pdf

- id: Ryan2025-xa
  entry_type: article
  title: Bifidobacteria support optimal infant vaccine responses
  authors: Ryan, Feargal J and Clarke, Michelle and Lynn, Miriam A and Benson, Saoirse C and McAlister, Sonia and Giles, Lynne C and Choo, Jocelyn M and Rossouw, Charné and Ng, Yan Yung and Semchenko, Evgeny A and Richard, Alyson and Leong, Lex E X and Taylor, Steven L and Blake, Stephen J and Mugabushaka, Joyce I and Walker, Mary and Wesselingh, Steve L and Licciardi, Paul V and Seib, Kate L and Tumes, Damon J and Richmond, Peter and Rogers, Geraint B and Marshall, Helen S and Lynn, David J
  journal: Nature
  actual_journal: Nature
  year: 2025
  doi: 10.1038/s41586-025-08796-4
  pmid: '40175554'
  pmc: ''
  abstract: Accumulating evidence indicates that antibiotic exposure may lead to impaired vaccine responses1-4; however, the mechanisms underlying this association remain poorly understood. Here we prospectively followed 191 healthy, vaginally born, term infants from birth to 15 months, using a systems vaccinology approach to assess the effects of antibiotic exposure on immune responses to vaccination. Exposure to direct neonatal but not intrapartum antibiotics was associated with significantly lower antibody titres against various polysaccharides in the 13-valent pneumococcal conjugate vaccine and the Haemophilus influenzae type b polyribosylribitol phosphate and diphtheria toxoid antigens in the combined 6-in-1 Infanrix Hexa vaccine at 7 months of age. Blood from infants exposed to neonatal antibiotics had an inflammatory transcriptional profile before vaccination; in addition, faecal metagenomics showed reduced abundance of Bifidobacterium species in these infants at the time of vaccination,
    which was correlated with reduced vaccine antibody titres 6 months later. In preclinical models, responses to the 13-valent pneumococcal conjugate vaccine were strongly dependent on an intact microbiota but could be restored in germ-free mice by administering a consortium of Bifidobacterium species or a probiotic already widely used in neonatal units. Our data suggest that microbiota-targeted interventions could mitigate the detrimental effects of early-life antibiotics on vaccine immunogenicity.

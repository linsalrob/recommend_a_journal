- id: Gow2023-fn
  entry_type: article
  title: Architecture of the dynamic fungal cell wall
  authors: Gow, Neil A R and Lenardon, Megan D
  journal: Nat. Rev. Microbiol.
  actual_journal: Nat. Rev. Microbiol.
  year: 2023
  doi: 10.1038/s41579-022-00796-9
  pmid: '36266346'
  pmc: ''
  abstract: The fungal cell wall is essential for growth and survival, and is a key target for antifungal drugs and the immune system. The cell wall must be robust but flexible, protective and shielding yet porous to nutrients and membrane vesicles and receptive to exogenous signals. Most fungi have a common inner wall skeleton of chitin and β-glucans that functions as a flexible viscoelastic frame to which a more diverse set of outer cell wall polymers and glycosylated proteins are attached. Whereas the inner wall largely determines shape and strength, the outer wall confers properties of hydrophobicity, adhesiveness, and chemical and immunological heterogeneity. The spatial organization and dynamic regulation of the wall in response to prevailing growth conditions enable fungi to thrive within changing, diverse and often hostile environments. Understanding this architecture provides opportunities to develop diagnostics and drugs to combat life-threatening fungal infections.

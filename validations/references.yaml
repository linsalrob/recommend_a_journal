- id: Widder2024-gl
  entry_type: article
  title: Microbial community organization designates distinct pulmonary exacerbation types and predicts treatment outcome in cystic fibrosis
  authors: Widder, Stefanie and Carmody, Lisa A and Opron, Kristopher and Kalikin, Linda M and Caverly, Lindsay J and LiPuma, John J
  journal: Nat. Commun.
  actual_journal: Nat. Commun.
  year: 2024
  doi: 10.1038/s41467-024-49150-y
  pmid: '38849369'
  pmc: PMC11161516
  abstract: Polymicrobial infection of the airways is a hallmark of obstructive lung diseases such as cystic fibrosis (CF), non-CF bronchiectasis, and chronic obstructive pulmonary disease. Pulmonary exacerbations (PEx) in these conditions are associated with accelerated lung function decline and higher mortality rates. Understanding PEx ecology is challenged by high inter-patient variability in airway microbial community profiles. We analyze bacterial communities in 880 CF sputum samples collected during an observational prospective cohort study and develop microbiome descriptors to model community reorganization prior to and during 18 PEx. We identify two microbial dysbiosis regimes with opposing ecology and dynamics. Pathogen-governed PEx show hierarchical community reorganization and reduced diversity, whereas anaerobic bloom PEx display stochasticity and increased diversity. A simulation of antimicrobial treatment predicts better efficacy for hierarchically organized communities. This
    link between PEx, microbiome organization, and treatment success advances the development of personalized clinical management in CF and, potentially, other obstructive lung diseases.

  title: '{CFTR} modulator therapy drives microbiome restructuring through improved host physiology in cystic fibrosis: the {IMMProveCF} phase {IV} trial'
  authors: Knoll, Rebecca Luise and Brauny, Melanie Meihua and Robert, Evelyn and Cloos, Louisa and Waser, Lydia and Hilbert, Katja and Ulmer, Nina and Hillen, Barlo and Birkner, Till and Bartolomaeus, Theda Ulrike Patricia and Nitsche, Oliver and Jarquín-Díaz, Víctor Hugo and Lynch, Susan and Gehring, Stephan and Maier, Lisa and Poplawska, Krystyna and Forslund-Startceva, Sofia Kirke

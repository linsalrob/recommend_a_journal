- id: Levrier2025-xe
  entry_type: article
  title: A synthetic cell phage cycle
  authors: Levrier, Antoine and Soudier, Paul and Garenne, David and Izri, Ziane and Bowden, Steven and Lindner, Ariel B and Noireaux, Vincent
  journal: Nat. Commun.
  actual_journal: Nat. Commun.
  year: 2025
  doi: 10.1038/s41467-025-67249-8
  pmid: '41398148'
  pmc: PMC12808745
  abstract: Viral infection of living cells, exemplified by bacteriophage interaction with bacteria, is fundamental to biology and universal across living systems. Here, we establish an all-cell-free viral cycle where T7 phages infect synthetic cells, equipped with lipopolysaccharides on the outer leaflet of the lipid membrane, while encapsulating a cell-free gene expression system. We track each cycle step to demonstrate T7 phage-specific adsorption onto the liposomes, genome entry, replication, expression, and assembly of new infectious virions within the synthetic cells. We quantify key characteristics of the cycle, including the multiplicity of infection, replication efficiency, liposome size constraints, and phage rebinding dynamics. This work establishes a versatile, fully defined in vitro platform for reconstructing and investigating viral infections from individual molecular components.

- id: Wawina-Bokalanga2026-oa
  entry_type: article
  title: Deciphering the etiology of the 2024 outbreak of undiagnosed febrile illness in Panzi, Democratic Republic of the Congo
  authors: Wawina-Bokalanga, Tony and Makangara-Cigolo, Jean-Claude and Ola-Mpumbe, Rilia and Lokilo, Emmanuel and Mwakisenda-Tshakotsho, François and Delphine, Mbonga and Kahindo, Immaculée and Tshonaka-Nkololo, Alphonse and Vakaniaki, Emmanuel Hasivirwe and Loman, Nicholas and Houben, Sarah and Lumembe-Numbi, Raphael and Kinganda-Lusamaki, Eddy and Ponga-Museme, Ange and Mukota-Nungu, Yero and Kumar, Anuj and Meris, Matondo and Wilkinson, Sam and Colquhoun, Raquel and Kenye, Kelly-Michel and Akil-Bandali, Prince and Amuri-Aziza, Adrienne and Martinez, Gustavo Sganzerla and Kelvin, David J and Dijkman, Ronald and Hensley, Lisa E and Kasita, Cris and Kafua-Wemba, Franck and Mwamba, Dieudonné and Subissi, Lorenzo and Hoff, Nicole A and Peeters, Martine and Rimoin, Anne W and Mokili, John L and Lunguya-Metila, Octavie and Nkwembe, Edith and Rambaut, Andrew and Liesenborghs, Laurens and Low, Nicola and Kindrachuk, Jason and Vercauteren, Koen and Edwards, Robert and Kelly, Jenna N and Mbala-Kingebeni,
    Placide and Ahuka-Mundeke, Steve and Mumba, Dieudonné and Muyembe-Tamfum, Jean-Jacques
  journal: Nat. Med.
  actual_journal: Nat. Med.
  year: 2026
  doi: 10.1038/s41591-026-04235-7
  pmid: '41708925'
  pmc: ''
  abstract: In late 2024, an outbreak of over 400 cases of undiagnosed febrile illness, predominantly presenting as fever and cough, was reported in Panzi Health Zone, southwestern Democratic Republic of the Congo. Here we conducted an epidemiological and laboratory investigation to determine the etiology of the outbreak. Clinical data and specimens were prospectively collected from 108 individuals, of whom 59/108 (54.6%) were female. Children aged <5 years were the most affected (47/108, 43.5%); 14/32 (43.7%) were malnourished. Oro/nasopharyngeal swabs from 96/108 individuals were PCR tested; 26 blood samples were sequenced. Plasmodium falciparum was detected in 56/108 (51.8%) individuals. Co-infections were also detected, with influenza A(H1N1)pdm09 virus in 16/56 (28.6%) and severe acute respiratory syndrome coronavirus 2 in 10/56 (17.9%) individuals. No novel pathogens were detected via metagenomics. Our findings suggest that the outbreak was primarily associated with a surge in malaria
    cases, with concurrent viral respiratory infections. Increasing decentralized laboratory capacity and strengthening broader health systems remain crucial for faster outbreak detection and investigation.

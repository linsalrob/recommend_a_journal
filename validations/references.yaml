- id: Coshic2024-ce
  entry_type: article
  title: The structure and physical properties of a packaged bacteriophage particle
  authors: Coshic, Kush and Maffeo, Christopher and Winogradoff, David and Aksimentiev, Aleksei
  journal: Nature
  actual_journal: Nature
  year: 2024
  doi: 10.1038/s41586-024-07150-4
  pmid: '38448589'
  pmc: PMC11196859
  abstract: A string of nucleotides confined within a protein capsid contains all the instructions necessary to make a functional virus particle, a virion. Although the structure of the protein capsid is known for many virus species1,2, the three-dimensional organization of viral genomes has mostly eluded experimental probes3,4. Here we report all-atom structural models of an HK97 virion5, including its entire 39,732 base pair genome, obtained through multiresolution simulations. Mimicking the action of a packaging motor6, the genome was gradually loaded into the capsid. The structure of the packaged capsid was then refined through simulations of increasing resolution, which produced a 26 million atom model of the complete virion, including water and ions confined within the capsid. DNA packaging occurs through a loop extrusion mechanism7 that produces globally different configurations of the packaged genome and gives each viral particle individual traits. Multiple microsecond-long all-atom
    simulations characterized the effect of the packaged genome on capsid structure, internal pressure, electrostatics and diffusion of water, ions and DNA, and revealed the structural imprints of the capsid onto the genome. Our approach can be generalized to obtain complete all-atom structural models of other virus species, thereby potentially revealing new drug targets at the genome-capsid interface.

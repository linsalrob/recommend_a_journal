- id: Tomofuji2023-ex
  entry_type: article
  title: Reconstruction of the personal information from human genome reads in gut metagenome sequencing data
  authors: Tomofuji, Yoshihiko and Sonehara, Kyuto and Kishikawa, Toshihiro and Maeda, Yuichi and Ogawa, Kotaro and Kawabata, Shuhei and Nii, Takuro and Okuno, Tatsusada and Oguro-Igashira, Eri and Kinoshita, Makoto and Takagaki, Masatoshi and Yamamoto, Kenichi and Kurakawa, Takashi and Yagita-Sakamaki, Mayu and Hosokawa, Akiko and Motooka, Daisuke and Matsumoto, Yuki and Matsuoka, Hidetoshi and Yoshimura, Maiko and Ohshima, Shiro and Nakamura, Shota and Inohara, Hidenori and Kishima, Haruhiko and Mochizuki, Hideki and Takeda, Kiyoshi and Kumanogoh, Atsushi and Okada, Yukinori
  journal: Nat. Microbiol.
  actual_journal: Nat. Microbiol.

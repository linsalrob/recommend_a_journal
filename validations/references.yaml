  title: Phage-assisted evolution of allosteric protein switches
  authors: Southern, Nicholas T and von Bachmann, Anna and Hovsepyan, Alisa and Griebl, Marielouise and Wolf, Benedict and Lemmen, Nina and Kroell, Ann-Sophie and Westermann, Simon and Mathony, Jan and Niopek, Dominik
  journal: Nat. Commun.
  actual_journal: Nat. Commun.
  year: 2026
  doi: 10.1038/s41467-026-71717-0
  pmid: '41980963'
  pmc: ''
  abstract: Allostery, the transmission of locally induced conformational changes to distant functional sites, is a key mechanism for protein regulation. Artificial allosteric effectors enable remote manipulation of cell function; their engineering, however, is hampered by our limited understanding of allosteric residue networks. Here, we introduce a phage-assisted evolution platform for in vivo optimization of allosteric proteins. It applies opposing selection pressures to enhance activity and switchability of phage-encoded effectors and leverages retron-based recombineering to broadly explore fitness landscapes, introducing point mutations, insertions, and deletions. Applying this framework to the transcription factor AraC yielded near-binary optogenetic switches, with light-controlled activity spanning 1000-fold dynamic range. Long-read sequencing across selection cycles enabled high-resolution tracking of evolving variant pools, revealing adaptive trajectories and context-dependent residue
    interactions. Mechanistically, we find that linker mutations promoting α-helix extension at the sensor-effector junction enhance conformational coupling between LOV2 and AraC. These variants emerge consistently across independently evolved pools, underscoring their functional relevance. Together, we develop a framework for the directed evolution of programmable allosteric switches in vivo. By coupling dynamic selection with deep mutational scanning and temporal sequencing, it enables both functional optimization and mechanistic insight into allosteric networks.

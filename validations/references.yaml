- id: Welsh2025-oh
  entry_type: article
  title: A widespread hydrogenase supports fermentative growth of gut bacteria in healthy people
  authors: Welsh, Caitlin and Cabotaje, Princess R and Marcelino, Vanessa R and Watts, Thomas D and Kountz, Duncan J and Jespersen, Marion and Gould, Jodee A and Doan, Nhu Quynh and Lingford, James P and Koralegedara, Thilini and Solari, Jessica and D'Adamo, Gemma L and Huang, Ping and Bong, Natasha and Gulliver, Emily L and Young, Remy B and Land, Henrik and Walter, Kaija and Cann, Isaac and Pereira, Gabriel V and Martens, Eric C and Wolf, Patricia G and Ridlon, Jason M and Gaskins, H Rex and Giles, Edward M and Lyras, Dena and Lappan, Rachael and Berggren, Gustav and Forster, Samuel C and Greening, Chris
  journal: Nat. Microbiol.
  actual_journal: Nat. Microbiol.
  year: 2025
  doi: 10.1038/s41564-025-02154-w
  pmid: ''
  pmc: ''
  abstract: Abstract Disruption of hydrogen (H 2 ) cycling in the gut is linked to gastrointestinal disorders, infections and cancers. However, the mechanisms and microorganisms controlling H 2 production in the gut remain unresolved. Here we show that gut H 2 production is primarily driven by the microbial group B [FeFe]-hydrogenase. Metagenomics and metatranscriptomics of stool and tissue biopsy samples show that hydrogenase-encoding genes are widely present and transcribed in gut bacteria. Assessment of 19 taxonomically diverse gut isolates revealed that the group B [FeFe]-hydrogenases produce large amounts of H 2 gas and support fermentative growth of Bacteroidetes and Firmicutes. Further biochemical and spectroscopic characterization of purified enzymes show that they are catalytically active, bind a di-iron active site and reoxidize ferredoxin derived from the pyruvate:ferredoxin oxidoreductase reaction. Group B hydrogenase-encoding genes are significantly depleted in favour of other
    fermentative hydrogenases in patients with Crohn’s disease. Finally, metabolically flexible respiratory bacteria may be the dominant hydrogenotrophs in the gut, rather than acetogens, methanogens and sulfate reducers. These results uncover the enzymes and microorganisms controlling H 2 cycling in the healthy human gut.

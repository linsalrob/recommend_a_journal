- id: Shaw2023-rr
  entry_type: article
  title: 'Sensitive poliovirus detection using nested {PCR} and nanopore sequencing: a prospective validation study'
  authors: Shaw, Alexander G and Mampuela, Tresor Kabeya and Lofiko, Emmanuel Lokilo and Pratt, Catherine and Troman, Catherine and Bujaki, Erika and O'Toole, Áine and Akello, Joyce Odeke and Aziza, Adrienne Amuri and Lusamaki, Eddy Kinganda and Makangara, Jean Claude and Akonga, Marceline and Lay, Yvonne and Nsunda, Bibiche and White, Bailey and Jorgensen, David and Pukuta, Elizabeth and Riziki, Yogolelo and Rankin, Kathleen E and Rambaut, Andrew and Ahuka-Mundeke, Steve and Muyembe, Jean-Jacques and Martin, Javier and Grassly, Nicholas C and Mbala-Kingebeni, Placide
  journal: Nat. Microbiol.
  actual_journal: Nat. Microbiol.
  year: 2023
  doi: 10.1038/s41564-023-01453-4
  pmid: '37591995'
  pmc: PMC10465353
  abstract: Timely detection of outbreaks is needed for poliovirus eradication, but gold standard detection in the Democratic Republic of the Congo takes 30 days (median). Direct molecular detection and nanopore sequencing (DDNS) of poliovirus in stool samples is a promising fast method. Here we report prospective testing of stool samples from suspected polio cases, and their contacts, in the Democratic Republic of the Congo between 10 August 2021 and 4 February 2022. DDNS detected polioviruses in 62/2,339 (2.7%) of samples, while gold standard combination of cell culture, quantitative PCR and Sanger sequencing detected polioviruses in 51/2,339 (2.2%) of the same samples. DDNS provided case confirmation in 7 days (median) in routine surveillance conditions. DDNS enabled confirmation of three serotype 2 circulating vaccine-derived poliovirus outbreaks 23 days (mean) earlier (range 6-30 days) than the gold standard method. The mean sequence similarity between sequences obtained by the two
    methods was 99.98%. Our data confirm the feasibility of implementing DDNS in a national poliovirus laboratory.

- id: Gamaarachchi2025-on
  entry_type: article
  title: Targeted sequencing and iterative assembly of near-complete genomes
  authors: Gamaarachchi, Hasindu and Stevanovski, Igor and Hammond, Jillian M and M Reis, Andre L and Rapadas, Melissa and Jayasooriya, Kavindu and Russell, Tonia and Yeow, Dennis and Hort, Yvonne and Patel, Chirag and Mallett, Andrew J and Stackpoole, Elaine and Roman, Lauren and Silver, Luke W and Hogg, Carolyn J and Streeting, Louise M and Bogdanovic, Ozren and Coelho Rodrigues Noronha, Renata and Santos do Nascimento, Luís Adriano and Lima Cardoso, Adauto and Georges, Arthur and Cheng, Haoyu and Patel, Hardip R and Kumar, Kishore Raj and Mallawaarachchi, Amali C and Deveson, Ira W
  journal: Nat. Commun.
  actual_journal: Nat. Commun.
  year: 2025
  doi: 10.1038/s41467-025-65410-x
  pmid: '41285770'
  pmc: PMC12644460
  abstract: Advances in long-read sequencing (LRS) and assembly algorithms have made it possible to create highly complete genome assemblies for humans, animals and plants. However, ongoing development is needed to improve accessibility, affordability, and assembly quality and completeness. 'Cornetto' is a new strategy in which we use programmable selective nanopore sequencing to focus LRS data production onto the unsolved regions of a nascent assembly. This improves assembly quality and streamlines the process, both for humans and non-human vertebrates. Cornetto enables us to generate highly complete diploid human genome assemblies using only nanopore LRS data, surpassing the quality of previous efforts at a fraction of the cost. Cornetto enables genome assembly from challenging sample types like human saliva. Finally, we obtain accurate assemblies for clinically-relevant repetitive loci at the extremes of the genome, demonstrating valid approaches for genetic diagnosis in facioscapulohumeral
    muscular dystrophy (FSHD) and MUC1-autosomal dominant tubulointerstitial kidney disease (MUC1-ADTKD).

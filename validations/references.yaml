- id: Bouras2023-sa
  entry_type: article
  title: 'Plassembler: an automated bacterial plasmid assembly tool'
  authors: Bouras, G and Sheppard, A and Mallawaarachchi, V and Vreugde, S
  journal: Bioinformatics

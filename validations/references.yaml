- id: Starikova2020-wz
  entry_type: article
  title: 'Phigaro: high-throughput prophage sequence annotation'
  authors: Starikova, Elizaveta V and Tikhonova, Polina O and Prianichnikov, Nikita A and Rands, Chris M and Zdobnov, Evgeny M and Ilina, Elena N and Govorun, Vadim M
  journal: Bioinformatics

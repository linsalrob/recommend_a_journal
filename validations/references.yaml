- id: Rochette2026-og
  entry_type: article
  title: Diversity-generating retroelements for programmable targeted hypermutagenesis
  authors: Rochette, Paul and Lopez-Rodriguez, Elena and Wen, David J and Régnier, Léo and Fan, Catherine and Maikova, Anna and Rostain, William and Wang, Linhan and Nooraddin, Imran and Maire, Amandine and Vittot, Paul and Barrabes, Nathan and Cerdas-Mejías, Karol Melissa and Bouvier, Auguste and Chrysostomou, Thea and Subrini, Orso and Wolff, Nicolas and Monasson, Rémi and Cocco, Simona and Shipman, Seth L and Laurenceau, Raphael and Bikard, David
  journal: Nat. Biotechnol.
  actual_journal: Nat. Biotechnol.
  year: 2026
  doi: 10.1038/s41587-026-03078-4
  pmid: ''
  pmc: ''
  abstract: Diversity-generating retroelements (DGRs) are natural systems that accelerate the evolution of diverse bacterial functions through targeted hypermutation. We establish a method using DGRs coupled to recombineering (DGRec), which enables the diversification of any sequence of interest in Escherichia coli. Detailed characterization of reverse transcriptase sequence biases demonstrates how it maximizes the exploration of the sequence space while avoiding nonsense mutations. By leveraging the high error rate of the DGR reverse transcriptase at adenines, DGRec can efficiently diversify user-defined sequence windows of 50–200 bp. Mutations can be focused at specific positions, with rates reaching up to 1.38 × 10−2 per base per generation, allowing up to 24 mutations to accumulate within a single target sequence after 48 h. We apply DGRec to phage λ host-range engineering, to the evolution of dCas9 variants and to accelerated evolution of specific nanobodies through a bacterial display
    setup. Lastly, we establish the feasibility of DGR-mediated mutagenesis in yeast by adapting a recombination and selection strategy previously developed for retrons. Diversity-generating retroelements are engineered for directed evolution in E.coli.

  doi: 10.1038/s41564-024-01661-6
  pmid: '38565896'
  pmc: PMC11087260
  abstract: Dormant prophages protect lysogenic cells by expressing diverse immune systems, which must avoid targeting their cognate prophages upon activation. Here we report that multiple Staphylococcus aureus prophages encode Tha (tail-activated, HEPN (higher eukaryotes and prokaryotes nucleotide-binding) domain-containing anti-phage system), a defence system activated by structural tail proteins of incoming phages. We demonstrate the function of two Tha systems, Tha-1 and Tha-2, activated by distinct tail proteins. Interestingly, Tha systems can also block reproduction of the induced tha-positive prophages. To prevent autoimmunity after prophage induction, these systems are inhibited by the product of a small overlapping antisense gene previously believed to encode an excisionase. This genetic organization, conserved in S. aureus prophages, allows Tha systems to protect prophages and their bacterial hosts against phage predation and to be turned off during prophage induction, balancing
    immunity and autoimmunity. Our results show that the fine regulation of these processes is essential for the correct development of prophages' life cycle.

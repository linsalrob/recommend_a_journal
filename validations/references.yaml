- id: Prabakaran2026-pb
  entry_type: article
  title: Quantifying uncertainty in protein representations across models and tasks
  authors: Prabakaran, R and Bromberg, Yana
  journal: Nat. Methods
  actual_journal: Nat. Methods
  year: 2026
  doi: 10.1038/s41592-026-03028-7
  pmid: '41922570'
  pmc: PMC13076229
  abstract: Biomolecular embeddings serve as efficient representations of sequence and structure, enabling tasks such as similarity searches, structure and function prediction and estimation of biophysical properties. However, relying on embeddings without assessing their ability to accurately represent biomolecules is a critical flaw-akin to using a scalpel in surgery without verifying its sharpness. Here we propose a means to evaluate the capacity of protein language models to encode biologically meaningful information. For each protein, representation uncertainty is scored as the fraction of non-biological 'synthetic' sequences among its nearest neighbors in latent space. Our analysis reveals that low-quality embeddings often fail to capture meaningful biology, displaying vector properties indistinguishable from those of randomly generated sequences. Our model-agnostic scoring framework is, to our knowledge, the first to quantify protein sequence embedding reliability. It enables embedding
    screening prior to downstream applications and inferences, significantly improving their reliability. We propose that embedding evaluation should be undertaken for other uses of language models in science as well.

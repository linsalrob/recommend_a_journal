- id: Mirhakkak2023-lx
  entry_type: article
  title: Genome-scale metabolic modeling of Aspergillus fumigatus strains reveals growth dependencies on the lung microbiome
  authors: Mirhakkak, Mohammad H and Chen, Xiuqiang and Ni, Yueqiong and Heinekamp, Thorsten and Sae-Ong, Tongta and Xu, Lin-Lin and Kurzai, Oliver and Barber, Amelia E and Brakhage, Axel A and Boutin, Sebastien and Schäuble, Sascha and Panagiotou, Gianni
  journal: Nat. Commun.
  actual_journal: Nat. Commun.
  year: 2023
  doi: 10.1038/s41467-023-39982-5
  pmid: '37474497'
  pmc: PMC10359302
  abstract: Aspergillus fumigatus, an opportunistic human pathogen, frequently infects the lungs of people with cystic fibrosis and is one of the most common causes of infectious-disease death in immunocompromised patients. Here, we construct 252 strain-specific, genome-scale metabolic models of this important fungal pathogen to study and better understand the metabolic component of its pathogenic versatility. The models show that 23.1% of A. fumigatus metabolic reactions are not conserved across strains and are mainly associated with amino acid, nucleotide, and nitrogen metabolism. Profiles of non-conserved reactions and growth-supporting reaction fluxes are sufficient to differentiate strains, for example by environmental or clinical origin. In addition, shotgun metagenomics analysis of sputum from 40 cystic fibrosis patients (15 females, 25 males) before and after diagnosis with an A. fumigatus colonization suggests that the fungus shapes the lung microbiome towards a more beneficial
    fungal growth environment associated with aromatic amino acid availability and the shikimate pathway. Our findings are starting points for the development of drugs or microbiome intervention strategies targeting fungal metabolic needs for survival and colonization in the non-native environment of the human lung.

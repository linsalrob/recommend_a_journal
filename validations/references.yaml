- id: Papudeshi2025-xm
  entry_type: article
  title: 'Sphae: an automated toolkit for predicting phage therapy candidates from sequencing data'
  authors: Papudeshi, Bhavya and Roach, Michael J and Mallawaarachchi, Vijini and Bouras, George and Grigson, Susanna R and Giles, Sarah K and Harker, Clarice M and Hutton, Abbey L K and Tarasenko, Anita and Inglis, Laura K and Vega, Alejandro A and Souza, Cole and Boling, Lance and Hajama, Hamza and Cobián Güemes, Ana Georgina and Segall, Anca M and Dinsdale, Elizabeth A and Edwards, Robert A
  journal: Bioinform. Adv.
  actual_journal: Bioinform. Adv.
  year: 2025
  doi: 10.1093/bioadv/vbaf004
  pmid: '39897948'
  pmc: PMC11783317
  abstract: 'Motivation: Phage therapy offers a viable alternative for bacterial infections amid rising antimicrobial resistance. Its success relies on selecting safe and effective phage candidates that require comprehensive genomic screening to identify potential risks. However, this process is often labor intensive and time-consuming, hindering rapid clinical deployment. Results: We developed Sphae, an automated bioinformatics pipeline designed to streamline the therapeutic potential of a phage in under 10 minutes. Using Snakemake workflow manager, Sphae integrates tools for quality control, assembly, genome assessment, and annotation tailored specifically for phage biology. Sphae automates the detection of key genomic markers, including virulence factors, antimicrobial resistance genes, and lysogeny indicators such as integrase, recombinase, and transposase, which could preclude therapeutic use. Among the 65 phage sequences analyzed, 28 showed therapeutic potential, 8 failed due to low
    sequencing depth, 22 contained prophage or virulent markers, and 23 had multiple phage genomes. This workflow produces a report to assess phage safety and therapy suitability quickly. Sphae is scalable and portable, facilitating efficient deployment across most high-performance computing and cloud platforms, accelerating the genomic evaluation process. Availability and implementation: Sphae source code is freely available at https://github.com/linsalrob/sphae, with installation supported on Conda, PyPi, Docker containers.'

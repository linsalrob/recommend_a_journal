- id: Grigson2026-wy
  entry_type: article
  title: Co-migration of hundreds of microbial species over metres drives selection and promotes non-motile hitchhikers
  authors: Grigson, Susanna R and Hutton, Abbey L K and Carlson-Jones, Jessica A P and Paterson, James S and Giles, Sarah K and Harker, Clarice M and Grigson, Amelia K and Annells, Amy N and Roach, Michael J and Speck, Peter G and Edwards, Robert A and Mitchell, James G
  journal: Nat. Commun.
  actual_journal: Nat. Commun.
  year: 2026
  doi: 10.1038/s41467-026-72998-1
  pmid: '42156755'
  pmc: ''
  abstract: Bacteria dominate the biosphere and assemble into highly diverse communities, yet the mechanisms by which these communities migrate remain poorly understood. Here, we used a meso-tube chemotaxis assay to track taxonomic, functional and genomic shifts within sewage-derived microbial communities that migrate in self-organized bands over metre scales. Chemotactic bands accelerated during migration and incorporated non-motile bacterial hitchhikers as well as up to 10⁶ viruses/mL. Approximately 500 species co-migrated, with relative abundances fluctuating by orders of magnitude over time. The final communities exhibited enrichment of functional genes linked to motility and chemotaxis, consistent with adaptation to migration. Despite this functional convergence, replicate communities differed in taxonomic composition, reflecting environmental filtering that selects for functionally equivalent species. By revealing how chemotaxis governs large-scale microbial migration, this work provides
    a framework for understanding microbial spread in natural ecosystems and host-associated environments.

- id: Chklovski2023-gv
  entry_type: article
  title: '{CheckM2}: a rapid, scalable and accurate tool for assessing microbial genome quality using machine learning'
  authors: Chklovski, Alex and Parks, Donovan H and Woodcroft, Ben J and Tyson, Gene W
  journal: Nat. Methods
  actual_journal: Nat. Methods
  year: 2023
  doi: 10.1038/s41592-023-01940-w
  pmid: '37500759'
  pmc: ''
  abstract: Advances in sequencing technologies and bioinformatics tools have dramatically increased the recovery rate of microbial genomes from metagenomic data. Assessing the quality of metagenome-assembled genomes (MAGs) is a critical step before downstream analysis. Here, we present CheckM2, an improved method of predicting genome quality of MAGs using machine learning. Using synthetic and experimental data, we demonstrate that CheckM2 outperforms existing tools in both accuracy and computational speed. In addition, CheckM2's database can be rapidly updated with new high-quality reference genomes, including taxa represented only by a single genome. We also show that CheckM2 accurately predicts genome quality for MAGs from novel lineages, even for those with reduced genome size (for example, Patescibacteria and the DPANN superphylum). CheckM2 provides accurate genome quality predictions across bacterial and archaeal lineages, giving increased confidence when inferring biological conclusions
    from MAGs.
  pdf: refs/C/Chklovski et al. 2023 - CheckM2 - a rapid, scalable and accurate tool for assessing microbial genome quality using machine learning.pdf
